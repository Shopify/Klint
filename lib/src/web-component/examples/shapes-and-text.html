<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klint Web Component - Shapes and Text</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .example {
            background: white;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        klint {
            border-radius: 4px;
            overflow: hidden;
        }
        h3 {
            margin: 10px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Klint Web Component - Shapes and Text Examples</h1>
        <p>Various examples showcasing different drawing capabilities.</p>
        
        <div class="grid">
            <!-- Basic Shapes -->
            <div class="example">
                <h3>Basic Shapes</h3>
                <klint width="300" height="300" static="true">
                    <script type="text/klint">
                        function draw(ctx) {
                            ctx.background('#f0f0f0');
                            
                            // Circle
                            ctx.fillColor(ctx.Color.coral);
                            ctx.strokeColor(ctx.Color.navy);
                            ctx.strokeWidth(3);
                            ctx.circle(75, 75, 50);
                            
                            // Rectangle
                            ctx.fillColor(ctx.Color.sky);
                            ctx.rectangle(175, 50, 80, 50);
                            
                            // Rounded Rectangle
                            ctx.fillColor(ctx.Color.mustard);
                            ctx.roundedRectangle(50, 150, 100, 60, 15);
                            
                            // Polygon (hexagon)
                            ctx.fillColor(ctx.Color.plum);
                            ctx.noStroke();
                            ctx.polygon(225, 180, 40, 6);
                        }
                    </script>
                </klint>
            </div>
            
            <!-- Gradients -->
            <div class="example">
                <h3>Gradients</h3>
                <klint width="300" height="300" static="true">
                    <script type="text/klint">
                        function draw(ctx) {
                            ctx.background('#fff');
                            
                            // Linear gradient
                            const linearGrad = ctx.gradient(0, 0, 300, 0);
                            ctx.addColorStop(linearGrad, 0, ctx.Color.coral);
                            ctx.addColorStop(linearGrad, 0.5, ctx.Color.mustard);
                            ctx.addColorStop(linearGrad, 1, ctx.Color.sky);
                            ctx.fillColor(linearGrad);
                            ctx.rectangle(0, 0, 300, 100);
                            
                            // Radial gradient
                            const radialGrad = ctx.radialGradient(150, 200, 0, 150, 200, 80);
                            ctx.addColorStop(radialGrad, 0, ctx.Color.rose);
                            ctx.addColorStop(radialGrad, 0.5, ctx.Color.plum);
                            ctx.addColorStop(radialGrad, 1, 'transparent');
                            ctx.fillColor(radialGrad);
                            ctx.circle(150, 200, 80);
                        }
                    </script>
                </klint>
            </div>
            
            <!-- Text Styling -->
            <div class="example">
                <h3>Text Styling</h3>
                <klint width="300" height="300" static="true">
                    <script type="text/klint">
                        function draw(ctx) {
                            ctx.background(ctx.Color.charcoal);
                            
                            // Different text styles
                            ctx.fillColor('#fff');
                            
                            ctx.textSize(24);
                            ctx.textWeight('bold');
                            ctx.alignText('center', 'top');
                            ctx.text('Bold Title', 150, 30);
                            
                            ctx.textSize(16);
                            ctx.textWeight('normal');
                            ctx.textStyle('italic');
                            ctx.text('Italic subtitle', 150, 70);
                            
                            // Multiline text
                            ctx.textStyle('normal');
                            ctx.alignText('left', 'top');
                            ctx.textLeading(25);
                            ctx.text('This is a\nmultiline text\nwith custom\nline spacing', 30, 120);
                            
                            // Text with stroke
                            ctx.textSize(36);
                            ctx.textWeight('bold');
                            ctx.alignText('center', 'middle');
                            ctx.fillColor(ctx.Color.golden);
                            ctx.strokeColor('#fff');
                            ctx.strokeWidth(2);
                            ctx.text('OUTLINED', 150, 250);
                        }
                    </script>
                </klint>
            </div>
            
            <!-- Custom Shapes -->
            <div class="example">
                <h3>Custom Shapes (beginShape/endShape)</h3>
                <klint width="300" height="300">
                    <script type="text/klint">
                        function draw(ctx) {
                            ctx.background('#2a2a2a');
                            
                            // Star shape
                            ctx.push();
                            ctx.translate(150, 150);
                            ctx.rotate(ctx.time * 0.5);
                            
                            ctx.fillColor(ctx.Color.golden);
                            ctx.strokeColor(ctx.Color.orange);
                            ctx.strokeWidth(2);
                            
                            ctx.beginShape();
                            for (let i = 0; i < 10; i++) {
                                const angle = (i * Math.PI * 2) / 10 - Math.PI / 2; // Start from top
                                const radius = i % 2 === 0 ? 80 : 40;
                                const x = Math.cos(angle) * radius;
                                const y = Math.sin(angle) * radius;
                                ctx.vertex(x, y);
                            }
                            ctx.endShape(true);
                            
                            ctx.pop();
                        }
                    </script>
                </klint>
            </div>
            
            <!-- Bezier Curves -->
            <div class="example">
                <h3>Bezier Curves</h3>
                <klint width="300" height="300">
                    <script type="text/klint">
                        function draw(ctx) {
                            ctx.background('#f5f5f5');
                            
                            // Animated bezier curve
                            const t = ctx.time * 2;
                            
                            ctx.strokeColor(ctx.Color.navy);
                            ctx.strokeWidth(3);
                            ctx.noFill();
                            
                            ctx.beginShape();
                            ctx.vertex(50, 150);
                            ctx.bezierVertex(
                                100, 50 + Math.sin(t) * 50,
                                200, 250 + Math.cos(t) * 50,
                                250, 150
                            );
                            ctx.endShape();
                            
                            // Show control points
                            ctx.fillColor(ctx.Color.coral);
                            ctx.noStroke();
                            ctx.circle(50, 150, 5);
                            ctx.circle(100, 50 + Math.sin(t) * 50, 5);
                            ctx.circle(200, 250 + Math.cos(t) * 50, 5);
                            ctx.circle(250, 150, 5);
                        }
                    </script>
                </klint>
            </div>
            
            <!-- Transformations -->
            <div class="example">
                <h3>Transformations</h3>
                <klint width="300" height="300" origin="center">
                    <script type="text/klint">
                        function draw(ctx) {
                            ctx.background('#e0e0e0');
                            
                            // Grid of rotating rectangles
                            for (let x = -100; x <= 100; x += 50) {
                                for (let y = -100; y <= 100; y += 50) {
                                    ctx.push();
                                    ctx.translate(x, y);
                                    ctx.rotate(ctx.time + (x + y) * 0.01);
                                    ctx.scale(0.8, 0.8);
                                    
                                    const color = ctx.Color.colors[
                                        Math.abs(Math.floor((x + y) / 50)) % ctx.Color.colors.length
                                    ];
                                    ctx.fillColor(color);
                                    ctx.noStroke();
                                    ctx.rectangle(0, 0, 30, 30);
                                    ctx.pop();
                                }
                            }
                        }
                    </script>
                </klint>
            </div>
        </div>
    </div>
    
    <script type="module">
        import '../klint-canvas.js';
    </script>
</body>
</html>
