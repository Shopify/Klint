name: Release and Publish

on:
  push:
    tags:
      - "v*" # triggers on version tags
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Important for generating release notes
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Clean install (workaround for rollup optional deps bug)
        run: |
          rm -rf node_modules package-lock.json
          npm install --workspace=packages/klint --include-workspace-root

      - name: Run tests
        run: npm run test --workspace=packages/klint

      - name: Build packages
        run: npm run build

      - name: Sync README to package
        run: cp README.md packages/klint/README.md

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('child_process');

            const tagName = process.env.RELEASE_TAG;

            // Get the previous tag
            let previousTag;
            try {
              previousTag = execSync('git describe --tags --abbrev=0 HEAD^').toString().trim();
            } catch (error) {
              console.log('No previous tag found, using first commit');
              previousTag = execSync('git rev-list --max-parents=0 HEAD').toString().trim();
            }

            // Get the commit messages between tags
            const commitLog = execSync(`git log ${previousTag}..HEAD --pretty=format:"* %s (%h)"`).toString().trim();

            const notes = `## Changes in ${tagName}\n\n${commitLog}`;
            core.setOutput('notes', notes);
            return notes;

      - name: Publish to npm (OIDC / Trusted Publishing)
        run: npm publish --workspace=packages/klint --access public --provenance
        env:
          NPM_TOKEN: "" # Empty string forces OIDC

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: Release ${{ env.RELEASE_TAG }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
