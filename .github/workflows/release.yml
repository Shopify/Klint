name: Release Package

on:
  push:
    tags:
      - "v*" # Run workflow on version tags, e.g. v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Important for generating release notes

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"

      - name: Install dependencies
        working-directory: ./lib
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: ./lib
        run: yarn test

      - name: Build
        working-directory: ./lib
        run: yarn build

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v6
        with:
          script: |
            const { execSync } = require('child_process');

            // Get the tag name
            const tagName = context.ref.replace('refs/tags/', '');

            // Get the previous tag
            let previousTag;
            try {
              previousTag = execSync('git describe --tags --abbrev=0 HEAD^').toString().trim();
            } catch (error) {
              console.log('No previous tag found, using first commit');
              previousTag = execSync('git rev-list --max-parents=0 HEAD').toString().trim();
            }

            // Get the commit messages between tags
            const commitLog = execSync(`git log ${previousTag}..HEAD --pretty=format:"* %s (%h)"`).toString().trim();

            const notes = `## Changes in ${tagName}\n\n${commitLog}`;
            core.setOutput('notes', notes);
            return notes;

      - name: Publish to NPM
        working-directory: ./lib
        run: yarn publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
