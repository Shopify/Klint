<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klint - Physics Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        klint {
            border: 1px solid #333;
            border-radius: 8px;
            margin: 20px 0;
            cursor: pointer;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #007AFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0051D5;
        }
        .info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Physics Simulation</h1>
        <p>Click to add balls. They bounce and interact with gravity!</p>
        
        <klint id="physics" width="800" height="600"></klint>
        
        <div class="controls">
            <button id="clearBtn">Clear All</button>
            <button id="gravityBtn">Toggle Gravity</button>
            <button id="wallsBtn">Toggle Walls</button>
        </div>
        
        <div class="info">
            <p>Balls: <span id="ballCount">0</span> | Gravity: <span id="gravityStatus">ON</span> | Walls: <span id="wallsStatus">ON</span></p>
        </div>
    </div>
    
    <script type="module">
        import '../klint-canvas.js';
        
        const canvas = document.getElementById('physics');
        const ballCountEl = document.getElementById('ballCount');
        const gravityStatusEl = document.getElementById('gravityStatus');
        const wallsStatusEl = document.getElementById('wallsStatus');
        
        let balls = [];
        let gravity = true;
        let walls = true;
        
        class Ball {
            constructor(x, y, ctx) {
                this.pos = ctx.createVector(x, y);
                this.vel = ctx.createVector(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10
                );
                this.acc = ctx.createVector(0, 0);
                this.radius = Math.random() * 20 + 10;
                this.mass = this.radius / 10;
                this.color = ctx.Color.colors[Math.floor(Math.random() * ctx.Color.colors.length)];
                this.damping = 0.99;
                this.bounce = 0.8;
            }
            
            applyForce(force) {
                const f = force.copy();
                f.div(this.mass);
                this.acc.add(f);
            }
            
            update(ctx) {
                if (gravity) {
                    this.applyForce(ctx.createVector(0, 0.3));
                }
                
                this.vel.add(this.acc);
                this.vel.mult(this.damping);
                this.pos.add(this.vel);
                this.acc.mult(0);
                
                // Bounce off walls
                if (walls) {
                    if (this.pos.x - this.radius < 0 || this.pos.x + this.radius > ctx.width) {
                        this.vel.x *= -this.bounce;
                        this.pos.x = ctx.constrain(this.pos.x, this.radius, ctx.width - this.radius);
                    }
                    
                    if (this.pos.y - this.radius < 0 || this.pos.y + this.radius > ctx.height) {
                        this.vel.y *= -this.bounce;
                        this.pos.y = ctx.constrain(this.pos.y, this.radius, ctx.height - this.radius);
                    }
                }
            }
            
            checkCollision(other, ctx) {
                const dist = this.pos.dist(other.pos);
                const minDist = this.radius + other.radius;
                
                if (dist < minDist) {
                    // Collision detected
                    const normal = ctx.createVector(
                        this.pos.x - other.pos.x,
                        this.pos.y - other.pos.y
                    );
                    normal.normalize();
                    
                    // Separate balls
                    const overlap = minDist - dist;
                    const separation = normal.copy();
                    separation.mult(overlap * 0.5);
                    this.pos.add(separation);
                    other.pos.sub(separation);
                    
                    // Calculate relative velocity
                    const relativeVel = ctx.createVector(
                        this.vel.x - other.vel.x,
                        this.vel.y - other.vel.y
                    );
                    
                    const velAlongNormal = relativeVel.dot(normal);
                    
                    if (velAlongNormal > 0) return;
                    
                    // Calculate impulse
                    const e = 0.8; // restitution
                    const j = -(1 + e) * velAlongNormal / (1/this.mass + 1/other.mass);
                    
                    const impulse = normal.copy();
                    impulse.mult(j);
                    
                    this.vel.add(impulse.copy().div(this.mass));
                    other.vel.sub(impulse.copy().div(other.mass));
                }
            }
            
            draw(ctx) {
                ctx.push();
                
                // Shadow
                ctx.fillColor('rgba(0, 0, 0, 0.3)');
                ctx.circle(this.pos.x + 5, this.pos.y + 5, this.radius);
                
                // Ball
                const grad = ctx.radialGradient(
                    this.pos.x - this.radius/3, 
                    this.pos.y - this.radius/3, 
                    0,
                    this.pos.x, 
                    this.pos.y, 
                    this.radius
                );
                ctx.addColorStop(grad, 0, 'rgba(255, 255, 255, 0.8)');
                ctx.addColorStop(grad, 0.3, this.color);
                ctx.addColorStop(grad, 1, this.color + '88');
                
                ctx.fillColor(grad);
                ctx.circle(this.pos.x, this.pos.y, this.radius);
                
                ctx.pop();
            }
        }
        
        canvas.setup = (ctx) => {
            ctx.background('#1a1a2e');
        };
        
        canvas.draw = (ctx) => {
            ctx.background('rgba(26, 26, 46, 0.1)');
            
            // Update and draw balls
            for (let i = 0; i < balls.length; i++) {
                balls[i].update(ctx);
                
                // Check collisions
                for (let j = i + 1; j < balls.length; j++) {
                    balls[i].checkCollision(balls[j], ctx);
                }
                
                balls[i].draw(ctx);
            }
            
            // Remove balls that fall off screen (if walls are off)
            if (!walls) {
                balls = balls.filter(ball => 
                    ball.pos.y < ctx.height + 100 &&
                    ball.pos.x > -100 && 
                    ball.pos.x < ctx.width + 100
                );
            }
            
            // Update UI
            ballCountEl.textContent = balls.length;
            
            // Draw instructions
            ctx.fillColor('rgba(255, 255, 255, 0.5)');
            ctx.textSize(14);
            ctx.alignText('center', 'top');
            ctx.text('Click to add balls', ctx.width / 2, 20);
        };
        
        // Mouse interaction
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * canvas.context.__dpr;
            const y = (e.clientY - rect.top) * canvas.context.__dpr;
            
            balls.push(new Ball(x, y, canvas.context));
        });
        
        // Controls
        document.getElementById('clearBtn').addEventListener('click', () => {
            balls = [];
        });
        
        document.getElementById('gravityBtn').addEventListener('click', () => {
            gravity = !gravity;
            gravityStatusEl.textContent = gravity ? 'ON' : 'OFF';
        });
        
        document.getElementById('wallsBtn').addEventListener('click', () => {
            walls = !walls;
            wallsStatusEl.textContent = walls ? 'ON' : 'OFF';
        });
    </script>
</body>
</html>
