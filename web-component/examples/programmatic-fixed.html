<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klint Web Component - Programmatic Example</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        klint {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            background: #007AFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0051D5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Klint Web Component - Programmatic Example</h1>
        <p>This example shows how to control Klint programmatically using JavaScript.</p>
        
        <klint id="myCanvas" width="800" height="400"></klint>
        
        <div class="controls">
            <button id="playBtn">Play</button>
            <button id="pauseBtn">Pause</button>
            <button id="saveBtn">Save Image</button>
            <button id="fullscreenBtn">Fullscreen</button>
        </div>
        
        <h2>Features Demonstrated:</h2>
        <ul>
            <li>Programmatic setup and draw functions</li>
            <li>Using Vector class for physics</li>
            <li>Interactive controls (play/pause/save)</li>
            <li>Custom events and callbacks</li>
        </ul>
    </div>
    
    <script type="module">
        import '../klint-canvas.js';
        
        // Get canvas element
        const canvas = document.getElementById('myCanvas');
        
        // Particle system
        let particles = [];
        
        class Particle {
            constructor(x, y, ctx) {
                this.pos = ctx.createVector(x, y);
                this.vel = ctx.createVector(
                    (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 4
                );
                this.size = Math.random() * 10 + 5;
                this.life = 1;
                this.color = ctx.Color.colors[Math.floor(Math.random() * ctx.Color.colors.length)];
            }
            
            update() {
                this.pos.add(this.vel);
                this.life -= 0.01;
                this.size *= 0.99;
            }
            
            draw(ctx) {
                ctx.push();
                ctx.fillColor(this.color);
                ctx.opacity(this.life);
                ctx.circle(this.pos.x, this.pos.y, this.size);
                ctx.pop();
            }
        }
        
        // Wait for canvas to be ready before setting up
        if (canvas) {
            // Setup function
            canvas.setup = (ctx) => {
                ctx.background('#000');
                console.log('Canvas ready!', ctx);
            };
            
            // Draw function
            canvas.draw = (ctx) => {
                // Fade background
                ctx.fillColor('rgba(0, 0, 0, 0.05)');
                ctx.rectangle(0, 0, ctx.width, ctx.height);
                
                // Add new particles at center
                if (Math.random() < 0.1) {
                    particles.push(new Particle(
                        ctx.width / 2 + (Math.random() - 0.5) * 100,
                        ctx.height / 2 + (Math.random() - 0.5) * 100,
                        ctx
                    ));
                }
                
                // Update and draw particles
                particles = particles.filter(p => p.life > 0);
                particles.forEach(p => {
                    p.update();
                    p.draw(ctx);
                });
                
                // Draw text
                ctx.fillColor('#fff');
                ctx.textSize(14);
                ctx.alignText('center', 'middle');
                ctx.text(`Particles: ${particles.length}`, ctx.width / 2, 30);
            };
            
            // Resize callback
            canvas.onResize = (ctx) => {
                console.log('Canvas resized:', ctx.width, ctx.height);
            };
            
            // Event listeners
            canvas.addEventListener('klint-ready', (e) => {
                console.log('Klint ready event:', e.detail);
            });
            
            // Control buttons
            document.getElementById('playBtn').addEventListener('click', () => {
                canvas.play();
            });
            
            document.getElementById('pauseBtn').addEventListener('click', () => {
                canvas.pause();
            });
            
            document.getElementById('saveBtn').addEventListener('click', () => {
                canvas.saveCanvas();
            });
            
            document.getElementById('fullscreenBtn').addEventListener('click', () => {
                canvas.fullscreen();
            });
            
            // Mouse interaction
            canvas.addEventListener('mousemove', (e) => {
                if (!canvas.context) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * canvas.context.__dpr;
                const y = (e.clientY - rect.top) * canvas.context.__dpr;
                
                // Add particle at mouse position
                particles.push(new Particle(x, y, canvas.context));
            });
        }
    </script>
</body>
</html>
