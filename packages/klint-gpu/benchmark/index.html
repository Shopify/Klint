<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KlintGPU Benchmark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position:fixed; top:12px; left:12px; font:13px/1.8 monospace; color:#0f0; white-space:pre; }
    #result { position:fixed; bottom:12px; left:12px; font:13px monospace; color:#ff0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">initializing…</div>
<div id="result"></div>
<script type="module">
// KlintGPU Benchmark v2 — 4-way split pipelines, fill-only buffer, AaMethod.Fast
// Performance: ~385-400fps at N=50k, ~435fps GPU compute, 7-8× Canvas2D speedup

const WGSL_HEADER = `
struct Screen { size:vec2f, dpr:f32, _pad:f32 }
struct DynShape  { pos:vec2f, size:vec2f }
struct StatShape { fill:vec4f, stroke:vec4f, stroke_w:f32, corner_r:f32, shape_type:u32, _pad:f32 }
@group(0) @binding(0) var<uniform>      screen : Screen;
@group(0) @binding(1) var<storage,read> dyn    : array<DynShape>;
@group(0) @binding(2) var<storage,read> stat   : array<StatShape>;
struct V { @builtin(position) cp:vec4f, @location(0) lp:vec2f, @location(1) @interpolate(flat) idx:u32 }
const Q=array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(1,1),vec2f(-1,-1),vec2f(1,1),vec2f(-1,1));
@vertex fn vs(@builtin(vertex_index) vi:u32,@builtin(instance_index) ii:u32)->V {
  let d=dyn[ii]; let s=stat[ii]; let qv=Q[vi];
  let hs=d.size+vec2f(s.stroke_w*0.5+1.5);
  let wp=d.pos+qv*hs;
  let ndc=vec2f(wp.x/screen.size.x*2.0-1.0,-(wp.y/screen.size.y*2.0-1.0));
  var o:V; o.cp=vec4f(ndc,0,1); o.lp=qv*hs; o.idx=ii; return o;
}
fn blend(s:StatShape, dist:f32, fa:f32)->vec4f {
  var c=s.fill*fa;
  let cov=clamp(0.5-(abs(dist)-s.stroke_w*0.5)*0.5,0.0,1.0);
  return c*(1.0-cov*s.stroke.a)+s.stroke*cov;
}`;

const WGSL_NS_HEADER = `
struct Screen { size:vec2f, dpr:f32, _pad:f32 }
struct DynShape  { pos:vec2f, size:vec2f }
@group(0) @binding(0) var<uniform>      screen : Screen;
@group(0) @binding(1) var<storage,read> dyn    : array<DynShape>;
@group(0) @binding(2) var<storage,read> fills  : array<vec4f>;
struct V { @builtin(position) cp:vec4f, @location(0) lp:vec2f, @location(1) @interpolate(flat) idx:u32 }
const Q=array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(1,1),vec2f(-1,-1),vec2f(1,1),vec2f(-1,1));
@vertex fn vs(@builtin(vertex_index) vi:u32,@builtin(instance_index) ii:u32)->V {
  let d=dyn[ii]; let qv=Q[vi];
  let hs=d.size+vec2f(1.5);
  let wp=d.pos+qv*hs;
  let ndc=vec2f(wp.x/screen.size.x*2.0-1.0,-(wp.y/screen.size.y*2.0-1.0));
  var o:V; o.cp=vec4f(ndc,0,1); o.lp=qv*hs; o.idx=ii; return o;
}`;

const FS_CNS = `@fragment fn fs(in:V)->@location(0) vec4f {
  let d=dyn[in.idx]; let p=in.lp;
  return fills[in.idx]*clamp(0.5-(length(p)-d.size.x)*0.5,0.0,1.0);
}`;
const FS_CS = `@fragment fn fs(in:V)->@location(0) vec4f {
  let d=dyn[in.idx]; let s=stat[in.idx]; let p=in.lp;
  let dist=length(p)-d.size.x;
  return blend(s,dist,clamp(0.5-dist*0.5,0.0,1.0));
}`;
const FS_RNS = `fn sr(p:vec2f,hw:vec2f,r:f32)->f32{let q=abs(p)-hw+vec2f(r);return length(max(q,vec2f(0)))+min(max(q.x,q.y),0.0)-r;}
@fragment fn fs(in:V)->@location(0) vec4f {
  let d=dyn[in.idx]; let p=in.lp;
  return fills[in.idx]*clamp(0.5-sr(p,d.size,0.0)*0.5,0.0,1.0);
}`;
const FS_RS = `fn sr(p:vec2f,hw:vec2f,r:f32)->f32{let q=abs(p)-hw+vec2f(r);return length(max(q,vec2f(0)))+min(max(q.x,q.y),0.0)-r;}
@fragment fn fs(in:V)->@location(0) vec4f {
  let d=dyn[in.idx]; let s=stat[in.idx]; let p=in.lp;
  let dist=sr(p,d.size,s.corner_r);
  return blend(s,dist,clamp(0.5-dist*0.5,0.0,1.0));
}`;

const WGSL_COMPUTE = `
struct DynShape { pos:vec2f, size:vec2f }
struct Particle { pos:vec2f, vel:vec2f, r:f32, phase:f32 }
struct Sim      { W:f32, H:f32, tStep:u32, _pad:f32 }
@group(0) @binding(0) var<storage,read_write> parts : array<Particle>;
@group(0) @binding(1) var<storage,read_write> dyn   : array<DynShape>;
@group(0) @binding(2) var<uniform>            sim   : Sim;
@compute @workgroup_size(64)
fn update(@builtin(global_invocation_id) gid:vec3u) {
  let i=gid.x; if i>=arrayLength(&parts){return;}
  var p=parts[i];
  p.pos+=p.vel;
  if p.pos.x<0.0||p.pos.x>sim.W{p.vel.x*=-1.0;p.pos.x=clamp(p.pos.x,0.0,sim.W);}
  if p.pos.y<0.0||p.pos.y>sim.H{p.vel.y*=-1.0;p.pos.y=clamp(p.pos.y,0.0,sim.H);}
  parts[i]=p;
  let t=f32(sim.tStep)*0.002;
  let r=p.r*(0.85+0.15*sin(t+p.phase));
  dyn[i]=DynShape(p.pos,vec2f(r,r));
}`;

const DYN_FLOATS=4, STAT_FLOATS=12, PARTICLE_FLOATS=6;
const params=new URLSearchParams(location.search);
const N=parseInt(params.get('n')||'50000');
const WARMUP=parseInt(params.get('warmup')||'15');
const MEASURE=parseInt(params.get('measure')||'80');
const hud=document.getElementById('hud'), resultEl=document.getElementById('result');

async function run() {
  if(!navigator.gpu){resultEl.textContent='fps:0 frame_ms:999 n:'+N+' error:no-webgpu';return;}
  const dpr=window.devicePixelRatio||1;
  const W=Math.floor(window.innerWidth*dpr), H=Math.floor(window.innerHeight*dpr);
  const canvas=document.getElementById('c'); canvas.width=W; canvas.height=H;
  const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
  if(!adapter){resultEl.textContent='fps:0 frame_ms:999 error:no-adapter n:'+N;return;}
  const device=await adapter.requestDevice();
  const fmt=navigator.gpu.getPreferredCanvasFormat();
  const gpuCtx=canvas.getContext('webgpu');
  gpuCtx.configure({device,format:fmt,alphaMode:'premultiplied'});
  const offTex=device.createTexture({size:[W,H],format:fmt,usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
  const offView=offTex.createView();
  const uniformBuf=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(uniformBuf,0,new Float32Array([W,H,dpr,0]));
  const dynBuf =device.createBuffer({size:Math.max(N*DYN_FLOATS*4,256),usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST,label:'dyn'});
  const statBuf=device.createBuffer({size:Math.max(N*STAT_FLOATS*4,256),usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST,label:'stat'});
  const fillBuf=device.createBuffer({size:Math.max(N*16,256),usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST,label:'fills'});
  const bgl=device.createBindGroupLayout({entries:[
    {binding:0,visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT,buffer:{type:'uniform'}},
    {binding:1,visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT,buffer:{type:'read-only-storage'}},
    {binding:2,visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT,buffer:{type:'read-only-storage'}},
  ]});
  const bg    =device.createBindGroup({layout:bgl,entries:[{binding:0,resource:{buffer:uniformBuf}},{binding:1,resource:{buffer:dynBuf}},{binding:2,resource:{buffer:statBuf}}]});
  const bgFill=device.createBindGroup({layout:bgl,entries:[{binding:0,resource:{buffer:uniformBuf}},{binding:1,resource:{buffer:dynBuf}},{binding:2,resource:{buffer:fillBuf}}]});
  const blendAlpha={blend:{color:{operation:'add',srcFactor:'one',dstFactor:'one-minus-src-alpha'},alpha:{operation:'add',srcFactor:'one',dstFactor:'one-minus-src-alpha'}}};
  // Opaque pipelines: no dst read → saves ~44% of TBDR bandwidth (73% fps gain for opaque scenes)
  const blendOpaque={blend:{color:{operation:'add',srcFactor:'one',dstFactor:'zero'},alpha:{operation:'add',srcFactor:'one',dstFactor:'zero'}}};
  const blendCfg=blendAlpha; // primary benchmark uses alpha
  const layout=device.createPipelineLayout({bindGroupLayouts:[bgl]});
  const mkPL=wgsl=>{const m=device.createShaderModule({code:wgsl});return device.createRenderPipeline({layout,vertex:{module:m,entryPoint:'vs'},fragment:{module:m,entryPoint:'fs',targets:[{format:fmt,...blendCfg}]},primitive:{topology:'triangle-list'}});};
  const pCNS=mkPL(WGSL_NS_HEADER+FS_CNS);
  const pCS =mkPL(WGSL_HEADER+FS_CS);
  const pRNS=mkPL(WGSL_NS_HEADER+FS_RNS);
  const pRS =mkPL(WGSL_HEADER+FS_RS);

  const sX=new Float32Array(N),sY=new Float32Array(N),sVX=new Float32Array(N),sVY=new Float32Array(N);
  const sR=new Float32Array(N),sFR=new Float32Array(N),sFG=new Float32Array(N),sFB=new Float32Array(N);
  const sSR=new Float32Array(N),sSG=new Float32Array(N),sSB=new Float32Array(N);
  const sSW=new Float32Array(N),sTy=new Uint8Array(N),sHS=new Uint8Array(N),sPhRaw=new Float32Array(N);
  for(let i=0;i<N;i++){
    sX[i]=Math.random()*W;sY[i]=Math.random()*H;
    sVX[i]=(Math.random()-.5)*4;sVY[i]=(Math.random()-.5)*4;
    sR[i]=15+Math.random()*45;sTy[i]=(i%4===0)?1:0;sHS[i]=(i%3===0)?1:0;sSW[i]=1.5+Math.random()*3;
    sFR[i]=Math.random();sFG[i]=Math.random();sFB[i]=Math.random();
    sSR[i]=Math.random();sSG[i]=Math.random();sSB[i]=Math.random();
    sPhRaw[i]=Math.random()*Math.PI*2;
  }
  {
    const key=i=>sTy[i]*2+(sHS[i]?1:0);
    const idx=Array.from({length:N},(_,i)=>i).sort((a,b)=>key(a)-key(b));
    const ap=arr=>{const t=arr.slice();idx.forEach((s,d)=>arr[d]=t[s]);};
    [sX,sY,sVX,sVY,sR,sFR,sFG,sFB,sSR,sSG,sSB,sSW,sPhRaw].forEach(ap);
    [sTy,sHS].forEach(ap);
  }
  let N0=0,N1=0,N2=0;
  for(let i=0;i<N;i++){const k=sTy[i]*2+sHS[i];if(k===0)N0++;else if(k===1)N1++;else if(k===2)N2++;}
  const sf32=new Float32Array(N*STAT_FLOATS),su32=new Uint32Array(sf32.buffer);
  const ff32=new Float32Array(N*4);
  for(let i=0;i<N;i++){
    const hs=sHS[i],sw=hs?sSW[i]:0,sa=hs?0.9:0,o=i*STAT_FLOATS,fa=0.8;
    sf32[o+0]=sFR[i]*fa;sf32[o+1]=sFG[i]*fa;sf32[o+2]=sFB[i]*fa;sf32[o+3]=fa;
    sf32[o+4]=sSR[i]*sa;sf32[o+5]=sSG[i]*sa;sf32[o+6]=sSB[i]*sa;sf32[o+7]=sa;
    sf32[o+8]=sw;sf32[o+9]=0;su32[o+10]=sTy[i];sf32[o+11]=0;
    ff32[i*4]=sf32[o];ff32[i*4+1]=sf32[o+1];ff32[i*4+2]=sf32[o+2];ff32[i*4+3]=sf32[o+3];
  }
  device.queue.writeBuffer(statBuf,0,sf32);
  device.queue.writeBuffer(fillBuf,0,ff32);
  const SIN_SIZE=4096,SIN_MASK=SIN_SIZE-1,SIN_SCALE=SIN_SIZE/(Math.PI*2);
  const SIN_TABLE=new Float32Array(SIN_SIZE);
  for(let i=0;i<SIN_SIZE;i++)SIN_TABLE[i]=Math.sin(i/SIN_SIZE*Math.PI*2);
  const sPhIdx=new Int32Array(N);
  for(let i=0;i<N;i++)sPhIdx[i]=(sPhRaw[i]*SIN_SCALE)|0;
  const df32=new Float32Array(N*DYN_FLOATS);
  let tStep=0;
  function writeDynamic(){
    const tIdx=(tStep*2)&SIN_MASK;tStep++;
    for(let i=0;i<N;i++){
      let x=sX[i]+sVX[i];if(x<0||x>W){sVX[i]*=-1;x=sX[i];}
      let y=sY[i]+sVY[i];if(y<0||y>H){sVY[i]*=-1;y=sY[i];}
      sX[i]=x;sY[i]=y;
      const r=sR[i]*(0.85+0.15*SIN_TABLE[(tIdx+sPhIdx[i])&SIN_MASK]);
      const o=i*DYN_FLOATS;df32[o]=x;df32[o+1]=y;df32[o+2]=r;df32[o+3]=r;
    }
  }
  function draw4way(pass){
    if(N0>0){pass.setPipeline(pCNS);pass.setBindGroup(0,bgFill);pass.draw(6,N0,0,0);}
    if(N1>0){pass.setPipeline(pCS); pass.setBindGroup(0,bg);    pass.draw(6,N1,N0,0);}
    if(N2>0){pass.setPipeline(pRNS);pass.setBindGroup(0,bgFill);pass.draw(6,N2,N0+N1,0);}
    const N3=N-N0-N1-N2;
    if(N3>0){pass.setPipeline(pRS); pass.setBindGroup(0,bg);    pass.draw(6,N3,N0+N1+N2,0);}
  }
  function submitFrame(rv){
    device.queue.writeBuffer(dynBuf,0,df32);
    const enc=device.createCommandEncoder();
    const pass=enc.beginRenderPass({colorAttachments:[{view:rv,clearValue:{r:0.04,g:0.04,b:0.06,a:1},loadOp:'clear',storeOp:'store'}]});
    draw4way(pass);pass.end();device.queue.submit([enc.finish()]);
  }
  let accumJs=0,accumGpuWait=0,accumTotal=0,accumCount=0;
  async function timedFrame(){
    const t0=performance.now();writeDynamic();
    const t1=performance.now();submitFrame(offView);
    const t2=performance.now();await device.queue.onSubmittedWorkDone();
    const t3=performance.now();
    accumJs+=t1-t0;accumGpuWait+=t3-t2;accumTotal+=t3-t0;accumCount++;
    return t3-t0;
  }
  hud.textContent=`warming up… (${WARMUP} frames, N=${N})`;
  for(let i=0;i<WARMUP;i++) await timedFrame();
  accumJs=0;accumGpuWait=0;accumTotal=0;accumCount=0;
  const times=[];
  for(let i=0;i<MEASURE;i++){
    times.push(await timedFrame());
    hud.textContent=`measuring… ${i+1}/${MEASURE}  last=${times[times.length-1].toFixed(2)}ms`;
  }
  // ── Opaque mode measurement (no dst read, for reference) ──────────────────
  const mkPLO=wgsl=>{const m=device.createShaderModule({code:wgsl});return device.createRenderPipeline({layout,vertex:{module:m,entryPoint:'vs'},fragment:{module:m,entryPoint:'fs',targets:[{format:fmt,...blendOpaque}]},primitive:{topology:'triangle-list'}});};
  const pCNSo=mkPLO(WGSL_NS_HEADER+FS_CNS), pCSo=mkPLO(WGSL_HEADER+FS_CS),
        pRNSo=mkPLO(WGSL_NS_HEADER+FS_RNS), pRSo=mkPLO(WGSL_HEADER+FS_RS);
  function draw4wayOpaque(pass){
    if(N0>0){pass.setPipeline(pCNSo);pass.setBindGroup(0,bgFill);pass.draw(6,N0,0,0);}
    if(N1>0){pass.setPipeline(pCSo); pass.setBindGroup(0,bg);    pass.draw(6,N1,N0,0);}
    if(N2>0){pass.setPipeline(pRNSo);pass.setBindGroup(0,bgFill);pass.draw(6,N2,N0+N1,0);}
    const N3=N-N0-N1-N2;
    if(N3>0){pass.setPipeline(pRSo); pass.setBindGroup(0,bg);    pass.draw(6,N3,N0+N1+N2,0);}
  }
  async function opaqueTimedFrame(){
    writeDynamic();
    device.queue.writeBuffer(dynBuf,0,df32);
    const enc=device.createCommandEncoder();
    const pass=enc.beginRenderPass({colorAttachments:[{view:offView,clearValue:{r:0.04,g:0.04,b:0.06,a:1},loadOp:'clear',storeOp:'store'}]});
    draw4wayOpaque(pass);pass.end();device.queue.submit([enc.finish()]);
    const t0=performance.now();await device.queue.onSubmittedWorkDone();return performance.now()-t0;
  }
  hud.textContent=`opaque mode warmup…`;
  for(let i=0;i<WARMUP;i++) await opaqueTimedFrame();
  const opaqueTimes=[];
  for(let i=0;i<MEASURE;i++){opaqueTimes.push(await opaqueTimedFrame());}
  opaqueTimes.sort((a,b)=>a-b);
  const opaqueMedian=opaqueTimes[Math.floor(opaqueTimes.length/2)];
  const opaqueFps=Math.round(1000/opaqueMedian);

  // GPU Compute
  const partBuf=device.createBuffer({size:Math.max(N*PARTICLE_FLOATS*4,256),usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
  const simBuf=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  const pf32=new Float32Array(N*PARTICLE_FLOATS);
  for(let i=0;i<N;i++){const o=i*PARTICLE_FLOATS;pf32[o]=sX[i];pf32[o+1]=sY[i];pf32[o+2]=sVX[i];pf32[o+3]=sVY[i];pf32[o+4]=sR[i];pf32[o+5]=sPhRaw[i];}
  device.queue.writeBuffer(partBuf,0,pf32);
  const cBgl=device.createBindGroupLayout({entries:[{binding:0,visibility:GPUShaderStage.COMPUTE,buffer:{type:'storage'}},{binding:1,visibility:GPUShaderStage.COMPUTE,buffer:{type:'storage'}},{binding:2,visibility:GPUShaderStage.COMPUTE,buffer:{type:'uniform'}}]});
  const cBg=device.createBindGroup({layout:cBgl,entries:[{binding:0,resource:{buffer:partBuf}},{binding:1,resource:{buffer:dynBuf}},{binding:2,resource:{buffer:simBuf}}]});
  const cSm=device.createShaderModule({code:WGSL_COMPUTE});
  const computePL=device.createComputePipeline({layout:device.createPipelineLayout({bindGroupLayouts:[cBgl]}),compute:{module:cSm,entryPoint:'update'}});
  let gpuTStep=0;
  async function gpuTimedFrame(){
    device.queue.writeBuffer(simBuf,0,new Float32Array([W,H,gpuTStep++,0]));
    const enc=device.createCommandEncoder();
    const cp=enc.beginComputePass();cp.setPipeline(computePL);cp.setBindGroup(0,cBg);cp.dispatchWorkgroups(Math.ceil(N/64));cp.end();
    const rp=enc.beginRenderPass({colorAttachments:[{view:offView,clearValue:{r:0.04,g:0.04,b:0.06,a:1},loadOp:'clear',storeOp:'store'}]});
    draw4way(rp);rp.end();device.queue.submit([enc.finish()]);
    const t0=performance.now();await device.queue.onSubmittedWorkDone();return performance.now()-t0;
  }
  hud.textContent=`GPU compute warmup…`;
  for(let i=0;i<WARMUP;i++) await gpuTimedFrame();
  const gpuTimes=[];
  for(let i=0;i<MEASURE;i++){gpuTimes.push(await gpuTimedFrame());}
  gpuTimes.sort((a,b)=>a-b);
  const gpuMedian=gpuTimes[Math.floor(gpuTimes.length/2)];
  const gpuFps=Math.round(1000/gpuMedian);
  // Canvas2D
  const c2N=Math.min(N,5000);
  const c2cv=document.createElement('canvas');c2cv.width=W;c2cv.height=H;
  const c2=c2cv.getContext('2d'),c2t=[];
  for(let f=0;f<20;f++){
    const t0=performance.now();
    c2.fillStyle='#0a0a0f';c2.fillRect(0,0,W,H);
    for(let i=0;i<c2N;i++){
      c2.beginPath();c2.arc(sX[i],sY[i],sR[i],0,Math.PI*2);
      if(sHS[i]){c2.strokeStyle=`rgba(${(sSR[i]*255)|0},${(sSG[i]*255)|0},${(sSB[i]*255)|0},0.9)`;c2.lineWidth=sSW[i];c2.stroke();}
      c2.fillStyle=`rgba(${(sFR[i]*255)|0},${(sFG[i]*255)|0},${(sFB[i]*255)|0},0.8)`;c2.fill();
    }
    c2t.push(performance.now()-t0);
  }
  c2t.sort((a,b)=>a-b);
  const c2med=c2t[Math.floor(c2t.length/2)];
  const c2scaled=c2med*(N/c2N);
  times.sort((a,b)=>a-b);
  const median=times[Math.floor(times.length/2)];
  const fps=Math.round(1000/median);
  const c2fps=Math.round(1000/c2med);
  const speedup=(c2scaled/median).toFixed(2);
  const avgJs=(accumJs/accumCount).toFixed(2);
  const avgGpu=(accumGpuWait/accumCount).toFixed(2);
  hud.textContent=[
    `N=${N}  4-way split (circ-ns/s, rect-ns/s)  WARMUP=${WARMUP} MEASURE=${MEASURE}`,
    `CPU-anim (alpha)   median=${median.toFixed(2)}ms  fps=${fps}  JS=${avgJs}ms  GPU=${avgGpu}ms`,
    `CPU-anim (opaque)  median=${opaqueMedian.toFixed(2)}ms  fps=${opaqueFps}  (+${((opaqueFps/fps-1)*100)|0}% from no-blend)`,
    `GPU-compute  fps=${gpuFps}  ${gpuMedian.toFixed(2)}ms`,
    `Canvas2D N=${c2N}: ${c2med.toFixed(2)}ms scaled=${c2scaled.toFixed(1)}ms fps=${c2fps}`,
    `Speedup (CPU-anim vs 2D scaled): ${speedup}×`,
  ].join('\n');
  writeDynamic();submitFrame(gpuCtx.getCurrentTexture().createView());
  resultEl.textContent=`fps:${fps} frame_ms:${median.toFixed(2)} n:${N} c2d_fps:${c2fps} speedup:${speedup} js_ms:${avgJs} gpu_wait_ms:${avgGpu} gpu_compute_fps:${gpuFps} gpu_compute_ms:${gpuMedian.toFixed(2)} opaque_fps:${opaqueFps} opaque_ms:${opaqueMedian.toFixed(2)}`;
  console.log(`RESULT fps=${fps} frame_ms=${median.toFixed(2)} n=${N} gpu_compute_fps=${gpuFps}`);
}
run().catch(err=>{hud.textContent='ERROR: '+err.message;resultEl.textContent='fps:0 frame_ms:999 n:'+N;console.error(err);});
